# Restricted mode (OIB_MODE=restricted in .env). The Makefile layers this file
# over compose.yaml. No container gets the Docker socket, the host's root
# filesystem, /var/run or /var/lib/docker, or an added capability.
#
#   - cAdvisor is removed: it needs all of those to read container metrics.
#   - Alloy keeps read-only /proc and /sys for host CPU, memory, disk I/O and
#     network metrics, but not the host's root filesystem, so the filesystem
#     collector (disk space per mount) is off. (It runs as a non-root user with
#     no capabilities in both modes; see compose.yaml.)
#   - Prometheus no longer scrapes cAdvisor.
services:
  cadvisor: !reset null

  alloy-metrics:
    volumes: !override
      - ./config/alloy-metrics.restricted.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment: !override
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys

  prometheus:
    volumes:
      - ./config/scrape.restricted:/etc/prometheus/scrape:ro
