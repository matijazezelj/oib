name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare example environment
        run: cp .env.example .env

      - name: Validate Docker Compose files
        env:
          # The example intentionally leaves this required secret empty. CI uses
          # an explicit non-production value solely to validate interpolation.
          GRAFANA_ADMIN_PASSWORD: ci-compose-validation-only
        run: |
          set -euo pipefail
          for file in \
            grafana/compose.yaml \
            logging/compose.yaml \
            metrics/compose.yaml \
            telemetry/compose.yaml \
            profiling/compose.yaml \
            services/compose.yaml \
            testing/compose.yaml \
            examples/demo-app/compose.yaml \
            examples/node-express/compose.yaml \
            examples/python-flask/compose.yaml \
            examples/php-laravel/compose.yaml \
            examples/ruby-rails/compose.yaml; do
            docker compose --env-file .env -f "$file" config >/dev/null
          done
          for file in */compose.restricted.yaml; do
            docker compose --env-file .env -f "${file%/*}/compose.yaml" -f "$file" config >/dev/null
          done

      - name: Validate docs and dashboard assets
        run: |
          set -euo pipefail
          test -f README.md
          test -f NOTICE.md
          test -f docs/index.md
          test -f docs/troubleshooting.md
          test -f grafana/provisioning/dashboards/json/system-overview.json
          test -f grafana/provisioning/dashboards/json/traces-explorer.json
          for image in dashboards stack-health system-overview host-metrics logs-explorer traces-explorer request-latency profiles-explorer; do
            test -f "docs/assets/images/$image.png"
          done
          ! grep -R -I $'\uFFFD' README.md docs

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Shell script lint (if any)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          mapfile -t scripts < <(find . -type f -name '*.sh' -not -path './.git/*')
          if [ "${#scripts[@]}" -gt 0 ]; then
            shellcheck --severity=warning "${scripts[@]}"
          fi

      - name: Validate JSON dashboards
        run: |
          set -euo pipefail
          find grafana logging metrics telemetry \
            -path '*/provisioning/dashboards/json/*.json' \
            -type f -print0 |
            while IFS= read -r -d '' file; do
              python3 -m json.tool "$file" >/dev/null
            done

      - name: Validate Makefile entry points
        run: |
          set -euo pipefail
          make help >/dev/null
          make -n health >/dev/null
          make -n demo >/dev/null

      - name: Reject unsafe Make endpoint values
        run: |
          set -euo pipefail
          printf '\nGRAFANA_PORT=3000;touch /tmp/oib-make-injection\n' >> .env
          output=$(make -n open)
          ! grep -Fq 'touch /tmp/oib-make-injection' <<<"$output"
