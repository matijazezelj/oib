name: acceptance

# Boots the real stacks and checks that data survives a backup/restore round
# trip and an upgrade from each earlier release. See testing/acceptance/README.md.

on:
  # Run on every change except pure documentation, so new scripts, configs or
  # directories are covered without having to remember to list them here.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'completions/**'
  push:
    branches: [main]
  # Weekly, to notice registry-side changes (moved or deleted image tags).
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The runner is thrown away afterwards; keep the stack up so a failure can be inspected below.
  KEEP: '1'

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Backup / restore round trip
        run: make test-backup

      - name: Container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --format '{{.Names}}' | grep '^oib-'); do
            echo "::group::$c"; docker logs --tail 200 "$c" 2>&1; echo "::endgroup::"
          done

  tempo-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: tempo migration recovery
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Tempo 2 -> 3 failures, rerun and rollback
        run: make test-tempo-recovery FROM=v1.0.0

      - name: Container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --format '{{.Names}}' | grep '^oib-'); do
            echo "::group::$c"; docker logs --tail 200 "$c" 2>&1; echo "::endgroup::"
          done

  restricted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: restricted mode
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restricted invariant, functionality and mode switches
        run: make test-restricted

      - name: Container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --format '{{.Names}}' | grep '^oib-'); do
            echo "::group::$c"; docker logs --tail 200 "$c" 2>&1; echo "::endgroup::"
          done

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: MCP endpoint
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read-only, authenticated, answers from OIB data
        run: make test-mcp

      - name: Container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --format '{{.Names}}' | grep '^oib-'); do
            echo "::group::$c"; docker logs --tail 200 "$c" 2>&1; echo "::endgroup::"
          done

  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: isolated-mode self-test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Concurrent, interrupted and killed isolated runs
        run: make test-isolation

  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Add every new release here; accepted losses go in testing/acceptance/upgrade-expectations.
        from: [v1.0.0, v1.1.0, v1.2.0, v1.3.0]
    name: upgrade from ${{ matrix.from }}
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Upgrade test
        run: make test-upgrade FROM=${{ matrix.from }}

      - name: Container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --format '{{.Names}}' | grep '^oib-'); do
            echo "::group::$c"; docker logs --tail 200 "$c" 2>&1; echo "::endgroup::"
          done
