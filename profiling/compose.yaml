name: oib-profiling

services:
  pyroscope:
    image: grafana/pyroscope:${PYROSCOPE_VERSION:-2.4.3}
    container_name: oib-pyroscope
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:${PYROSCOPE_PORT:-4040}:4040"
    volumes:
      - oib-pyroscope-data:/data
    # Single instance: skip the readiness delays meant for rolling updates in a
    # cluster (otherwise /ready takes ~60s). Note: a positional argument such as
    # "server" before these would stop flag parsing and silently drop them.
    command:
      - "-metastore.min-ready-duration=0"
      - "-segment-writer.min-ready-duration=0"
      - "-ingester.min-ready-duration=0"
    networks:
      - oib-network
    # Note: Pyroscope uses a distroless image with no shell/wget/curl
    # Health is monitored externally via 'make health' (no blackbox probe: the stack is optional)
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          memory: 256M

volumes:
  oib-pyroscope-data:
    name: oib-pyroscope-data

networks:
  oib-network:
    external: true
